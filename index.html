
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TELEK DICE — MEOWL</title>

<style>
:root {
  --accent: #a855f7;
  --accent-light: #e9b8ff;
  --bg: #090711;
  --panel: #151021;
  --text: #fff8ff;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  overflow-x: hidden;
  background:
    radial-gradient(ellipse at 50% 30%, #28113d 0%, transparent 55%),
    var(--bg);
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

.wrap {
  width: min(100%, 680px);
  text-align: center;
  position: relative;
  z-index: 1;
  transform: scale(1);
  transform-origin: center center;
  transition: transform 2.15s cubic-bezier(.2,.7,.2,1);
}

.logo {
  margin: 0 0 10px;
  font-size: clamp(36px, 8vw, 64px);
  font-weight: 1000;
  letter-spacing: 4px;
  color: white;
  text-shadow:
    0 0 5px #fff,
    0 0 12px var(--accent-light),
    0 0 25px var(--accent),
    0 0 55px var(--accent);
  animation: neonPulse 2s ease-in-out infinite alternate;
}

@keyframes neonPulse {
  from {
    text-shadow:
      0 0 5px #fff,
      0 0 12px var(--accent-light),
      0 0 25px var(--accent);
  }
  to {
    text-shadow:
      0 0 8px #fff,
      0 0 20px var(--accent-light),
      0 0 40px var(--accent),
      0 0 70px var(--accent);
  }
}

.subtitle {
  color: #c9b6dc;
  letter-spacing: 4px;
  font-size: 12px;
  margin-bottom: 28px;
}

.panel {
  background: rgba(21, 16, 33, .88);
  border: 1px solid #624080;
  border-radius: 24px;
  padding: clamp(20px, 5vw, 36px);
  box-shadow:
    0 0 30px #8b35c533,
    inset 0 0 24px #a855f70a;
  backdrop-filter: blur(12px);
}

.dice-area {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 18px;
  min-height: 155px;
  perspective: 800px;
}

.die {
  width: 100px;
  height: 100px;
  border-radius: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 55px;
  font-weight: 900;
  color: white;
  background: linear-gradient(145deg, #322047, #140e20);
  border: 2px solid var(--accent);
  box-shadow:
    0 0 12px var(--accent),
    inset 0 0 18px #ffffff0b;
  transition: border-color .3s, box-shadow .3s;
}

.die.rolling {
  animation: diceRoll .24s linear infinite;
}

@keyframes diceRoll {
  0% { transform: rotate(-8deg) scale(.94); }
  50% { transform: rotate(8deg) scale(1.06); }
  100% { transform: rotate(-8deg) scale(.94); }
}

.result {
  min-height: 38px;
  margin: 22px 0 8px;
  font-size: 24px;
  font-weight: 900;
  color: white;
  text-shadow: 0 0 16px var(--accent);
}

.status {
  min-height: 20px;
  color: #b9a5cb;
  font-size: 13px;
  margin-bottom: 20px;
}

.controls {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 12px;
}

button, select {
  font: inherit;
  border-radius: 12px;
  padding: 13px 20px;
}

button {
  cursor: pointer;
  border: 1px solid var(--accent-light);
  color: white;
  background: linear-gradient(135deg, #9d4edd, #6426a0);
  font-weight: 800;
  box-shadow: 0 0 18px #a855f744;
  transition: transform .15s, filter .15s;
}

button:hover {
  filter: brightness(1.2);
  transform: translateY(-2px);
}

button:disabled {
  opacity: .55;
  cursor: wait;
  transform: none;
}

select {
  background: #21172f;
  color: white;
  border: 1px solid #624080;
}

.hint {
  margin-top: 20px;
  color: #927da8;
  font-size: 12px;
}

/* Плавное приближение во время Mega Roll */
body.mega-approach .wrap {
  transform: scale(1.045);
}

/* Резкий зум в момент раскрытия */
body.mega-impact .wrap {
  transition: transform .12s ease-out;
  transform: scale(1.16);
}

body.mega-impact .die {
  box-shadow:
    0 0 20px white,
    0 0 50px var(--accent),
    0 0 90px var(--accent);
}

/* Белая вспышка */
#megaFlash {
  position: fixed;
  inset: 0;
  z-index: 999;
  background: white;
  opacity: 0;
  pointer-events: none;
}

body.mega-flash #megaFlash {
  animation: megaWhiteFlash .65s ease-out forwards;
}

@keyframes megaWhiteFlash {
  0% { opacity: 0; }
  12% { opacity: .98; }
  28% { opacity: .8; }
  100% { opacity: 0; }
}

@media (prefers-reduced-motion: reduce) {
  .logo {
    animation: none;
  }
  .wrap {
    transition-duration: .2s;
  }
}

@media (max-width: 420px) {
  .die {
    width: 82px;
    height: 82px;
    font-size: 44px;
  }
  .panel {
    padding: 20px 12px;
  }
}
</style>
</head>

<body>
<div id="megaFlash" aria-hidden="true"></div>

<main class="wrap">
  <h1 class="logo">TELEK DICE</h1>
  <div class="subtitle">MEOWL EDITION</div>

  <section class="panel">
    <div class="controls" style="margin-bottom: 24px">
      <select id="language" aria-label="Language">
        <option value="ru">Русский</option>
        <option value="en">English</option>
      </select>
      <select id="diceCount" aria-label="Dice count">
        <option value="1">1 Dice</option>
        <option value="2" selected>2 Dice</option>
        <option value="3">3 Dice</option>
        <option value="4">4 Dice</option>
      </select>
    </div>

    <div class="dice-area" id="diceArea">
      <div class="die">?</div>
      <div class="die">?</div>
    </div>

    <div class="result" id="result">Готов к броску?</div>
    <div class="status" id="status">Выбери количество кубиков</div>

    <div class="controls">
      <button id="rollButton">🎲 БРОСОК</button>
      <button id="megaButton">⚡ MEGA ROLL</button>
    </div>

    <div class="hint" id="hint">
      Mega Roll: плавный зум, резкое приближение и вспышка
    </div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);

const translations = {
  ru: {
    ready: "Готов к броску?",
    choose: "Выбери количество кубиков",
    rolling: "Кубики крутятся...",
    mega: "MEGA ROLL активирован!",
    result: "Результат:",
    roll: "🎲 БРОСОК",
    megaButton: "⚡ MEGA ROLL",
    hint: "Мега-бросок: зум, вспышка и раскрытие результата"
  },
  en: {
    ready: "Ready to roll?",
    choose: "Choose the number of dice",
    rolling: "Rolling the dice...",
    mega: "MEGA ROLL activated!",
    result: "Result:",
    roll: "🎲 ROLL",
    megaButton: "⚡ MEGA ROLL",
    hint: "Mega Roll: zoom, flash, and reveal"
  }
};

let busy = false;
let colorTimer = null;
let rollTimer = null;

function t(key) {
  return translations[$("language").value][key];
}

function createDice() {
  const count = Number($("diceCount").value);
  const area = $("diceArea");

  area.innerHTML = "";

  for (let i = 0; i < count; i++) {
    const die = document.createElement("div");
    die.className = "die";
    die.textContent = "?";
    area.appendChild(die);
  }

  $("result").textContent = t("ready");
  $("status").textContent = t("choose");
}

function randomColor() {
  const colors = [
    "#a855f7",
    "#22d3ee",
    "#ff4fd8",
    "#f59e0b",
    "#4ade80",
    "#fb7185"
  ];

  document.documentElement.style.setProperty(
    "--accent",
    colors[Math.floor(Math.random() * colors.length)]
  );
}

function setBusy(value) {
  busy = value;
  $("rollButton").disabled = value;
  $("megaButton").disabled = value;
  $("diceCount").disabled = value;
}

function rollDice(isMega = false) {
  if (busy) return;

  setBusy(true);

  const dice = [...document.querySelectorAll(".die")];
  const duration = isMega ? 2150 : 1000;

  $("result").textContent = "";
  $("status").textContent = isMega ? t("mega") : t("rolling");

  dice.forEach(die => {
    die.classList.add("rolling");
    die.textContent = "⚄";
  });

  if (isMega) {
    document.body.classList.remove("mega-impact", "mega-flash");
    document.body.classList.add("mega-approach");

    colorTimer = setInterval(randomColor, 180);
  }

  rollTimer = setInterval(() => {
    dice.forEach(die => {
      die.textContent = String(1 + Math.floor(Math.random() * 6));
    });
  }, 90);

  setTimeout(() => {
    clearInterval(rollTimer);

    const values = dice.map(() => 1 + Math.floor(Math.random() * 6));
    const total = values.reduce((sum, value) => sum + value, 0);

    dice.forEach((die, index) => {
      die.classList.remove("rolling");
      die.textContent = values[index];
    });

    $("result").textContent = `${t("result")} ${total}`;
    $("status").textContent = values.join(" + ");

    if (isMega) {
      clearInterval(colorTimer);

      document.body.classList.remove("mega-approach");
      document.body.classList.add("mega-impact", "mega-flash");

      setTimeout(() => {
        document.body.classList.remove("mega-impact");
      }, 700);

      setTimeout(() => {
        document.body.classList.remove("mega-flash");
      }, 700);
    }

    setBusy(false);
  }, duration);
}

$("rollButton").addEventListener("click", () => rollDice(false));
$("megaButton").addEventListener("click", () => rollDice(true));

$("diceCount").addEventListener("change", createDice);

$("language").addEventListener("change", () => {
  $("rollButton").textContent = t("roll");
  $("megaButton").textContent = t("megaButton");
  $("hint").textContent = t("hint");
  createDice();
});

createDice();
$("rollButton").textContent = t("roll");
$("megaButton").textContent = t("megaButton");
$("hint").textContent = t("hint");
</script>
</body>
</html>
