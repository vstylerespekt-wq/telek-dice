<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🐾 NEON DICE CLUB · MEOWL STYLE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Pacifico&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Montserrat', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      overflow-x: hidden;
      transition: background 0.8s ease;
    }
    
    /* Экран выбора языка */
    #language-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      animation: fadeIn 0.6s ease;
    }
    #language-screen h1 {
      font-family: 'Pacifico', cursive;
      font-size: 3rem;
      margin-bottom: 2rem;
      text-shadow: 0 0 20px rgba(255,255,255,0.5);
    }
    .language-buttons {
      display: flex;
      gap: 2rem;
    }
    .lang-btn {
      padding: 1.5rem 3rem;
      font-size: 1.5rem;
      font-weight: 600;
      border: 3px solid #fff;
      border-radius: 20px;
      background: rgba(255,255,255,0.1);
      color: #fff;
      cursor: pointer;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }
    .lang-btn:hover {
      background: rgba(255,255,255,0.3);
      transform: translateY(-5px) scale(1.05);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    
    .hidden {
      display: none !important;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    header {
      text-align: center;
      padding: 2rem 1rem;
      animation: slideDown 0.8s ease;
    }
    header h1 {
      font-family: 'Pacifico', cursive;
      font-size: 2.5rem;
      text-shadow: 0 0 20px rgba(255,255,255,0.6);
      margin-bottom: 0.5rem;
    }
    
    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-50px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 1rem;
    }
    
    section {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(15px);
      border-radius: 20px;
      padding: 2rem;
      margin-bottom: 2rem;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
      animation: fadeInUp 0.6s ease;
      transition: all 0.4s ease;
    }
    
    section:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 40px rgba(0,0,0,0.3);
    }
    
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    h2 {
      font-size: 1.8rem;
      margin-bottom: 1.5rem;
      text-shadow: 0 2px 10px rgba(0,0,0,0.3);
    }
    
    button {
      padding: 1rem 2rem;
      font-size: 1.1rem;
      font-weight: 600;
      font-family: 'Montserrat', sans-serif;
      border: 2px solid #fff;
      border-radius: 15px;
      background: rgba(255,255,255,0.2);
      color: #fff;
      cursor: pointer;
      transition: all 0.3s ease;
      margin: 0.5rem;
    }
    
    button:hover {
      background: rgba(255,255,255,0.4);
      transform: scale(1.05);
      box-shadow: 0 5px 20px rgba(255,255,255,0.3);
    }
    
    button:active {
      transform: scale(0.98);
    }
    
    input, select {
      padding: 0.8rem;
      font-size: 1rem;
      font-family: 'Montserrat', sans-serif;
      border: 2px solid rgba(255,255,255,0.5);
      border-radius: 10px;
      background: rgba(255,255,255,0.15);
      color: #fff;
      margin: 0.5rem;
      transition: all 0.3s ease;
    }
    
    input:focus, select:focus {
      outline: none;
      border-color: #fff;
      background: rgba(255,255,255,0.25);
      box-shadow: 0 0 15px rgba(255,255,255,0.4);
    }
    
    .dice-container {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
      margin: 2rem 0;
    }
    
    .dice {
      width: 80px;
      height: 80px;
      background: rgba(255,255,255,0.3);
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      font-weight: 700;
      box-shadow: 0 5px 20px rgba(0,0,0,0.3);
      transition: all 0.4s ease;
      animation: diceAppear 0.5s ease;
    }
    
    @keyframes diceAppear {
      from {
        opacity: 0;
        transform: scale(0) rotate(180deg);
      }
      to {
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }
    }
    
    .dice.rolling {
      animation: roll 0.6s ease-in-out;
    }
    
    @keyframes roll {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(90deg) scale(1.1); }
      50% { transform: rotate(180deg) scale(1.2); }
      75% { transform: rotate(270deg) scale(1.1); }
    }
    
    footer {
      text-align: center;
      padding: 2rem;
      font-size: 0.9rem;
      opacity: 0.8;
    }
    
    @media (max-width: 768px) {
      header h1 {
        font-size: 2rem;
      }
      section {
        padding: 1.5rem;
      }
      .lang-btn {
        padding: 1rem 2rem;
        font-size: 1.2rem;
      }
    }
  </style>
</head>
<body>

  <!-- Экран выбора языка -->
  <div id="language-screen">
    <h1>🐾 NEON DICE CLUB</h1>
    <div class="language-buttons">
      <button class="lang-btn" onclick="selectLanguage('ru')">🇷🇺 Русский</button>
      <button class="lang-btn" onclick="selectLanguage('en')">🇬🇧 English</button>
    </div>
  </div>

  <!-- Основной контент -->
  <div id="main-content" class="hidden">
    <header>
      <h1 id="main-title">🍂🍁🍃</h1>
      <h1 id="site-title">🐾 NEON DICE CLUB● MEOWL STYLE</h1>
      <p id="subtitle">🐾 ROLL YOUR COLORS · MEOW VIBES 🐾</p>
    </header>

    <main>
      <section>
        <h2 id="setup-title">НАСТРОЙ СВОЙ БРОСОК</h2>
        <label id="dice-count-label">КОЛИЧЕСТВО КУБИКОВ</label>
        <input type="number" id="diceCount" min="1" max="10" value="3">
        <button id="rollBtn">🎲 ROLL DICE</button>
        <label>
          <input type="checkbox" id="fastRoll">
          <span id="fast-roll-label">⚡ Fast Roll: ВЫКЛ</span>
        </label>
        
        <h3 id="result-title">РЕЗУЛЬТАТ БРОСКА</h3>
        <div id="result">Нажми ROLL DICE!</div>
        <div class="dice-container" id="diceContainer"></div>
        
        <button id="resetBtn">↻ Сбросить счёт</button>
        <p id="stats">БРОСКИ: 0 · СОВПАДЕНИЯ: 0 · СЕРИЯ: 0</p>
      </section>

      <!-- Остальные секции... -->
    </main>

    <footer>
      TELEK DICE · MEOWL-inspired style · Счёт хранится в этой вкладке
    </footer>
  </div>

  <script>
    let currentLang = 'ru';
    const translations = {
      ru: {
        mainTitle: '🍂🍁🍃',
        siteTitle: '🐾 NEON DICE CLUB● MEOWL STYLE',
        subtitle: '🐾 ROLL YOUR COLORS · MEOW VIBES 🐾',
        setupTitle: 'НАСТРОЙ СВОЙ БРОСОК',
        diceCountLabel: 'КОЛИЧЕСТВО КУБИКОВ',
        rollBtn: '🎲 ROLL DICE',
        fastRollLabel: '⚡ Fast Roll: ВЫКЛ',
        resultTitle: 'РЕЗУЛЬТАТ БРОСКА',
        resultInitial: 'Нажми ROLL DICE!',
        resetBtn: '↻ Сбросить счёт',
        stats: 'БРОСКИ: {rolls} · СОВПАДЕНИЯ: {matches} · СЕРИЯ: {streak}'
      },
      en: {
        mainTitle: '🍂🍁🍃',
        siteTitle: '🐾 NEON DICE CLUB● MEOWL STYLE',
        subtitle: '🐾 ROLL YOUR COLORS · MEOW VIBES 🐾',
        setupTitle: 'SET UP YOUR ROLL',
        diceCountLabel: 'NUMBER OF DICE',
        rollBtn: '🎲 ROLL DICE',
        fastRollLabel: '⚡ Fast Roll: OFF',
        resultTitle: 'ROLL RESULT',
        resultInitial: 'Press ROLL DICE!',
        resetBtn: '↻ Reset Score',
        stats: 'ROLLS: {rolls} · MATCHES: {matches} · STREAK: {streak}'
      }
    };

    function selectLanguage(lang) {
      currentLang = lang;
      document.getElementById('language-screen').classList.add('hidden');
      document.getElementById('main-content').classList.remove('hidden');
      updateLanguage();
    }

    function updateLanguage() {
      const t = translations[currentLang];
      document.getElementById('main-title').textContent = t.mainTitle;
      document.getElementById('site-title').textContent = t.siteTitle;
      document.getElementById('subtitle').textContent = t.subtitle;
      document.getElementById('setup-title').textContent = t.setupTitle;
      document.getElementById('dice-count-label').textContent = t.diceCountLabel;
      document.getElementById('rollBtn').textContent = t.rollBtn;
      document.querySelector('#fast-roll-label').textContent = t.fastRollLabel;
      document.getElementById('result-title').textContent = t.resultTitle;
      document.getElementById('result').textContent = t.resultInitial;
      document.getElementById('resetBtn').textContent = t.resetBtn;
      updateStats();
    }

    let stats = { rolls: 0, matches: 0, streak: 0 };

    function updateStats() {
      const t = translations[currentLang];
      document.getElementById('stats').textContent = t.stats
        .replace('{rolls}', stats.rolls)
        .replace('{matches}', stats.matches)
        .replace('{streak}', stats.streak);
    }

    document.getElementById('rollBtn').addEventListener('click', () => {
      const count = parseInt(document.getElementById('diceCount').value);
      const fastRoll = document.getElementById('fastRoll').checked;
      const container = document.getElementById('diceContainer');
      container.innerHTML = '';
      
      const results = [];
      for (let i = 0; i < count; i++) {
        const value = Math.floor(Math.random() * 6) + 1;
        results.push(value);
        const dice = document.createElement('div');
        dice.className = 'dice';
        if (!fastRoll) dice.classList.add('rolling');
        dice.textContent = value;
        container.appendChild(dice);
      }
      
      stats.rolls++;
      const allSame = results.every(v => v === results[0]);
      if (allSame && count > 1) {
        stats.matches++;
        stats.streak++;
      } else {
        stats.streak = 0;
      }
      
      updateStats();
      document.getElementById('result').textContent = `${results.join(' · ')}${allSame && count > 1 ? ' 🎉' : ''}`;
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      stats = { rolls: 0, matches: 0, streak: 0 };
      updateStats();
      document.getElementById('diceContainer').innerHTML = '';
      document.getElementById('result').textContent = translations[currentLang].resultInitial;
    });
  </script>

</body>
</html>
