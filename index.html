<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>TELEK DICE SHORT</title>
  <style>
    body { margin:0; min-height:100vh; background:#0b0d1a; color:#fff; font-family:sans-serif; display:flex; justify-content:center; align-items:center; overflow:hidden; }
    .game { width:100%; max-width:600px; text-align:center; padding:20px; }
    h1 { font-size:3rem; margin:0 0 10px; background:linear-gradient(90deg,#fff,#0ff,#f0f); -webkit-background-clip:text; color:transparent; text-shadow:0 0 20px rgba(0,255,255,.5); }
    .panel { background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:20px; padding:20px; backdrop-filter:blur(10px); }
    .colors { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin:20px 0; }
    .color-btn { width:50px; height:50px; border-radius:12px; border:none; cursor:pointer; transition:.2s; position:relative; overflow:hidden; }
    .color-btn::after { content:''; position:absolute; inset:0; background:rgba(255,255,255,0.2); opacity:0; transition:.1s; }
    .color-btn:hover::after { opacity:1; }
    .color-btn.active { transform:scale(1.1); box-shadow:0 0 20px currentColor; z-index:2; }
    button { background:linear-gradient(45deg,#0ff,#f0f); color:#000; border:none; padding:15px 30px; font-weight:bold; font-size:1.1rem; border-radius:50px; cursor:pointer; box-shadow:0 0 20px rgba(0,255,255,.4); margin:15px auto; display:block; }
    button:active { transform:scale(.95); }
    .results { display:grid; grid-template-columns:repeat(auto-fit,minmax(60px,1fr)); gap:10px; margin:20px auto; }
    .die-res { width:60px; height:60px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-weight:bold; box-shadow:inset 0 0 10px rgba(0,0,0,.5),0 5px 15px rgba(0,0,0,.3); }
    .win { box-shadow:0 0 30px currentColor !important; animation:pulse 1s infinite alternate; }
    @keyframes pulse { from { transform:scale(1); } to { transform:scale(1.05); } }
    #status { margin-top:15px; color:#aaa; font-size:.9rem; }
  </style>
</head>
<body>
  <div class="game">
    <h1>TELEK DICE</h1>
    <div class="panel">
      <p style="color:#aaa">Выбери цвет и брось кубики!</p>
      <div class="colors" id="colors"></div>
      <button id="roll">⚡ ROLL DICE</button>
      <div class="results" id="results"></div>
      <div id="status">Кликни по экрану, чтобы включить музыку</div>
    </div>
  </div>

  <script>
    // Звуки (короткие бесплатные сэмплы)
    const sounds = {
      click: new Audio('https://assets.mixkit.co/sfx/download/mixkit-quick-success-tone-287.mp3'),
      roll: new Audio('https://www.soundjay.com/human/sounds/dice-roll-01.mp3'),
      win: new Audio('https://assets.mixkit.co/sfx/download/mixkit-retro-arcade-game-over-213.mp3')
    };
    // Фоновая музыка
    const bgm = new Audio('https://assets.mixkit.co/music/preview/mixkit-arcade-ambiance-1236.mp3');
    bgm.loop = true;
    let isAudioUnlocked = false;

    document.addEventListener('click', () => {
      if (!isAudioUnlocked) {
        sounds.click.volume = 0.3;
        sounds.roll.volume = 0.4;
        sounds.win.volume = 0.5;
        bgm.volume = 0.2;
        try { bgm.play(); } catch(e) {}
        document.getElementById('status').textContent = 'Музыка играет! Бросай!';
        isAudioUnlocked = true;
      }
    }, { once: true });

    const colors = [
      {name:'Красный',hex:'#ff3333'},
      {name:'Оранжевый',hex:'#ffa000'},
      {name:'Жёлтый',hex:'#ffff00'},
      {name:'Зелёный',hex:'#00ff00'},
      {name:'Голубой',hex:'#00ffff'},
      {name:'Синий',hex:'#0066ff'},
      {name:'Фиолетовый',hex:'#aa00ff'},
      {name:'Розовый',hex:'#ff00aa'}
    ];
    let selectedColor = colors[0].hex;
    const colorsContainer = document.getElementById('colors');
    const resultsContainer = document.getElementById('results');
    const status = document.getElementById('status');

    colors.forEach(c => {
      const btn = document.createElement('button');
      btn.className = 'color-btn';
      btn.style.background = c.hex;
      btn.onclick = () => {
        document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedColor = c.hex;
        if (isAudioUnlocked) sounds.click.play().catch(()=>{})
      };
      colorsContainer.appendChild(btn);
    });
    colorsContainer.firstElementChild.classList.add('active');

    document.getElementById('roll').onclick = () => {
      if (isAudioUnlocked) sounds.roll.play().catch(()=>{})
      resultsContainer.innerHTML = '';
      status.textContent = 'Кубики летят...';
      setTimeout(() => {
        const count = Math.floor(Math.random() * 5) + 3; // 3–7 кубиков
        let wins = 0;
        for (let i = 0; i < count; i++) {
          const resColor = colors[Math.floor(Math.random() * colors.length)].hex;
          const die = document.createElement('div');
          die.className = 'die-res';
          die.style.background = resColor;
          die.textContent = i+1;
          if (resColor === selectedColor) {
            die.classList.add('win');
            wins++;
          }
          resultsContainer.appendChild(die);
        }
        if (wins > 0) {
          status.textContent = `Победа! Совпадений: ${wins}`;
          if (isAudioUnlocked) sounds.win.play().catch(()=>{})
        } else {
          status.textContent = 'Не повезло. Попробуй ещё!';
        }
      }, 800);
    };
  </script>
</body>
</html>
